<!DOCTYPE html>
<html lang="pl" data-theme="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CostWarden — Załóż konto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0910; --surface:#14121D; --surface-2:#1B1927;
    --ink:#F3F1FA; --ink-2:#CFCBDE; --muted:#9A96AE;
    --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.05);
    --teal:#2FD9C4; --leak:#FF6E5A; --leak-soft:rgba(255,110,90,.14);
    --grad:linear-gradient(115deg,#8B6DFF 0%,#2FD9C4 100%);
    --shadow-soft:0 16px 40px -24px rgba(0,0,0,.7);
    --ff-display:'Plus Jakarta Sans',system-ui,sans-serif;
    --ff-body:'Inter',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--ff-body);line-height:1.55;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

  .nav{display:flex;align-items:center;padding:26px 24px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mark{width:30px;height:30px}
  .brand .wm{font-family:var(--ff-display);font-weight:700;font-size:16.5px}

  .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 24px 60px}
  .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:34px;box-shadow:var(--shadow-soft)}
  .card h1{font-family:var(--ff-display);font-weight:800;font-size:21px;letter-spacing:-.02em;margin-bottom:6px}
  .card .sub{font-size:13.5px;color:var(--muted);margin-bottom:26px}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:7px}
  .field input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:12px 14px;font-family:var(--ff-body);font-size:14px;outline:none;transition:border-color .15s}
  .field input:focus{border-color:var(--teal)}
  .field .hint{font-size:11.5px;color:var(--muted);margin-top:6px}
  .field .err{font-size:11.5px;color:var(--leak);margin-top:6px;display:none}
  .field.invalid input{border-color:rgba(255,110,90,.5)}
  .field.invalid .err{display:block}

  .btn{font-family:var(--ff-display);font-weight:700;font-size:14px;width:100%;display:inline-flex;align-items:center;
    justify-content:center;gap:7px;border:none;border-radius:10px;padding:13px 20px;transition:filter .2s,transform .15s}
  .btn-grad{background:var(--grad);color:#0A0910;margin-top:6px}
  .btn-grad:hover{filter:brightness(1.08);transform:translateY(-1px)}

  .divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--muted);font-size:12px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}

  .foot-link{text-align:center;font-size:13px;color:var(--muted);margin-top:20px}
  .foot-link a{color:var(--teal);font-weight:600}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cw-mark" viewBox="0 0 44 44">
    <defs><linearGradient id="cwg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6DFF"/><stop offset="1" stop-color="#2FD9C4"/></linearGradient></defs>
    <rect x="1" y="1" width="42" height="42" rx="13" fill="url(#cwg)"/>
    <circle cx="19.5" cy="19.5" r="8.5" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M26 26l6 6" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 21l2.5-3 2.5 2 3-4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<nav class="nav">
  <a class="brand" href="index.html"><svg class="mark"><use href="#cw-mark"/></svg><span class="wm">CostWarden</span></a>
</nav>

<div class="wrap">
  <div class="card">
    <h1>Załóż konto</h1>
    <div class="sub">Zacznij odzyskiwać pieniądze od dostawców w kilka minut.</div>

    <form id="signupForm" novalidate>
      <div class="field" id="fieldName">
        <label for="fullName">Imię i nazwisko</label>
        <input type="text" id="fullName" placeholder="Jan Kowalski" autocomplete="name">
        <div class="err">Podaj imię i nazwisko.</div>
      </div>
      <div class="field" id="fieldEmail">
        <label for="email">Adres e-mail służbowy</label>
        <input type="email" id="email" placeholder="jan@twojafirma.pl" autocomplete="email">
        <div class="err">Podaj poprawny adres e-mail.</div>
      </div>
      <div class="field" id="fieldPassword">
        <label for="password">Hasło</label>
        <input type="password" id="password" placeholder="Min. 8 znaków" autocomplete="new-password">
        <div class="hint">Min. 8 znaków, przynajmniej jedna cyfra.</div>
        <div class="err">Hasło musi mieć min. 8 znaków i zawierać cyfrę.</div>
      </div>
      <button type="submit" class="btn btn-grad">Utwórz konto</button>
    </form>

    <div class="divider">albo</div>
    <button class="btn" style="background:var(--surface-2);color:var(--ink);border:1px solid var(--line)" id="ssoBtn">
      Kontynuuj z Google Workspace
    </button>

    <div class="foot-link">Masz już konto? <a href="signup.html">Zaloguj się</a></div>
  </div>
</div>

<script>
(function(){
  var form = document.getElementById('signupForm');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('fullName');
    var email = document.getElementById('email');
    var pass = document.getElementById('password');
    var ok = true;

    toggle('fieldName', name.value.trim().length > 1);
    toggle('fieldEmail', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim()));
    toggle('fieldPassword', pass.value.length >= 8 && /\d/.test(pass.value));

    function toggle(id, valid){
      document.getElementById(id).classList.toggle('invalid', !valid);
      if(!valid) ok = false;
    }
    if(ok){ window.location.href = 'create-org.html'; }
  });
  document.getElementById('ssoBtn').addEventListener('click', function(){
    window.location.href = 'create-org.html';
  });
})();
</script>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
  
</body>
</html>
