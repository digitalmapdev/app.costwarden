<!DOCTYPE html>
<html lang="pl" data-theme="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CostWarden — Utwórz organizację</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0910; --surface:#14121D; --surface-2:#1B1927;
    --ink:#F3F1FA; --ink-2:#CFCBDE; --muted:#9A96AE;
    --line:rgba(255,255,255,.09);
    --teal:#2FD9C4; --leak:#FF6E5A;
    --grad:linear-gradient(115deg,#8B6DFF 0%,#2FD9C4 100%);
    --shadow-soft:0 16px 40px -24px rgba(0,0,0,.7);
    --ff-display:'Plus Jakarta Sans',system-ui,sans-serif;
    --ff-body:'Inter',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--ff-body);line-height:1.55;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  button,select{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

  .nav{display:flex;align-items:center;padding:26px 24px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mark{width:30px;height:30px}
  .brand .wm{font-family:var(--ff-display);font-weight:700;font-size:16.5px}

  .progress-track{max-width:420px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:8px}
  .progress-track .seg{flex:1;height:4px;border-radius:100px;background:var(--surface-2)}
  .progress-track .seg.done{background:var(--grad)}

  .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 24px 60px}
  .card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:34px;box-shadow:var(--shadow-soft)}
  .card .kicker{font-size:12px;color:var(--teal);font-weight:700;font-family:var(--ff-display);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
  .card h1{font-family:var(--ff-display);font-weight:800;font-size:21px;letter-spacing:-.02em;margin-bottom:6px}
  .card .sub{font-size:13.5px;color:var(--muted);margin-bottom:26px}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:7px}
  .field input,.field select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:12px 14px;font-family:var(--ff-body);font-size:14px;outline:none;transition:border-color .15s}
  .field input:focus,.field select:focus{border-color:var(--teal)}
  .field .err{font-size:11.5px;color:var(--leak);margin-top:6px;display:none}
  .field.invalid input,.field.invalid select{border-color:rgba(255,110,90,.5)}
  .field.invalid .err{display:block}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  .btn{font-family:var(--ff-display);font-weight:700;font-size:14px;width:100%;display:inline-flex;align-items:center;
    justify-content:center;gap:7px;border:none;border-radius:10px;padding:13px 20px;transition:filter .2s,transform .15s}
  .btn-grad{background:var(--grad);color:#0A0910;margin-top:8px}
  .btn-grad:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .skip{text-align:center;font-size:12.5px;color:var(--muted);margin-top:16px}
  .skip a{color:var(--teal);font-weight:600}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cw-mark" viewBox="0 0 44 44">
    <defs><linearGradient id="cwg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6DFF"/><stop offset="1" stop-color="#2FD9C4"/></linearGradient></defs>
    <rect x="1" y="1" width="42" height="42" rx="13" fill="url(#cwg)"/>
    <circle cx="19.5" cy="19.5" r="8.5" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M26 26l6 6" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 21l2.5-3 2.5 2 3-4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<nav class="nav">
  <a class="brand" href="index.html"><svg class="mark"><use href="#cw-mark"/></svg><span class="wm">CostWarden</span></a>
</nav>

<div class="progress-track"><div class="seg done"></div><div class="seg"></div></div>

<div class="wrap">
  <div class="card">
    <div class="kicker">Krok 2 z 2 · Konfiguracja konta</div>
    <h1>Utwórz organizację</h1>
    <div class="sub">To przestrzeń, w której będą przechowywane dane Twojej firmy — dostawcy, faktury i findings.</div>

    <form id="orgForm" novalidate>
      <div class="field" id="fieldOrgName">
        <label for="orgName">Nazwa organizacji</label>
        <input type="text" id="orgName" placeholder="np. Meridian Hospitality Group">
        <div class="err">Podaj nazwę organizacji.</div>
      </div>
      <div class="field" id="fieldIndustry">
        <label for="industry">Branża</label>
        <select id="industry">
          <option value="">Wybierz branżę</option>
          <option>Hospitality / gastronomia</option>
          <option>Produkcja</option>
          <option>Logistyka</option>
          <option>Handel detaliczny</option>
          <option>Usługi profesjonalne</option>
          <option>Inna</option>
        </select>
        <div class="err">Wybierz branżę.</div>
      </div>
      <div class="field">
        <label for="spend">Roczne wydatki (EUR)</label>
        <input type="text" id="spend" placeholder="np. 500 000">
      </div>
      <button type="submit" class="btn btn-grad">Utwórz organizację i przejdź dalej</button>
    </form>
    <div class="skip"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>

<script>

console.log("CREATE ORG SCRIPT STARTED");

const form = document.getElementById("orgForm");

form.addEventListener("submit", async function(e){
  e.preventDefault();

  const orgName = document.getElementById("orgName").value.trim();
  const industry = document.getElementById("industry").value;

  if(!orgName || !industry){
    alert("Uzupełnij wymagane pola");
    return;
  }

  try{

    // 1. pobieramy aktualnego usera
    const { data:userData, error:userError } = await supabaseClient.auth.getUser();

    if(userError || !userData.user){
      alert("Brak zalogowanego użytkownika");
      return;
    }

    const userId = userData.user.id;

    // 2. tworzymy organizację i pobieramy jej ID
    const { data:orgData, error:orgError } = await supabaseClient
      .from("organizations")
      .insert({
        name: orgName,
        industry: industry
      })
      .select("id")
      .single();

    if(orgError){
      console.error(orgError);
      alert(orgError.message);
      return;
    }

    const orgId = orgData.id;
    console.log("Organization created:", orgId);

    // 3. dodajemy usera jako owner
    const { error:memberError } = await supabaseClient
      .from("org_members")
      .insert({
        org_id: orgId,
        user_id: userId,
        role: "owner"
      });

    if(memberError){
      console.error(memberError);
      alert(memberError.message);
      return;
    }

    console.log("Owner added");

    // 4. dalej
    window.location.href = "upload.html";

  }
  catch(err){
    console.error(err);
    alert("Wystąpił błąd podczas tworzenia organizacji");
  }

});

</script>
</body>
</html>
